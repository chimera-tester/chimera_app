<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHIMERA | TERMINAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Брутализм 2.0 - строгие линии, монохром, резкие контрасты */
        :root {
            --bg-color: #050505; 
            --card-bg: #111; 
            --text-main: #e0e0e0;
            --text-accent: #fff; 
            --border-color: #2a2a2a; 
            --green-bet: #4CAF50;
            --red-lose: #ff3333; 
            --main-font: 'Courier New', Courier, monospace;
        }
        
        * { box-sizing: border-box; }
        
        body { 
            background-color: var(--bg-color); color: var(--text-main); 
            font-family: var(--main-font); margin: 0; padding: 0; 
            display: flex; flex-direction: column; align-items: center; 
            height: 100vh; overflow: hidden; position: relative;
        }

        /* --- ПОДСВЕТКА ВСЕГО ЭКРАНА --- */
        .screen-flash {
            position: fixed; inset: 0; pointer-events: none; z-index: 9999; 
            opacity: 0; transition: opacity 0.3s;
        }
        .screen-flash.win.active { animation: fullScreenGreen 1.5s ease-out forwards; }
        .screen-flash.lose.active { animation: fullScreenRed 0.8s ease-out forwards; }
        
        @keyframes fullScreenGreen {
            0% { box-shadow: inset 0 0 100px rgba(76, 175, 80, 0.6); background: rgba(76, 175, 80, 0.05); opacity: 1; }
            100% { box-shadow: inset 0 0 0px rgba(76, 175, 80, 0); background: transparent; opacity: 0; }
        }
        @keyframes fullScreenRed {
            0% { box-shadow: inset 0 0 120px rgba(255, 51, 51, 0.6); background: rgba(255, 51, 51, 0.1); opacity: 1; }
            100% { box-shadow: inset 0 0 0px rgba(255, 51, 51, 0); background: transparent; opacity: 0; }
        }

        /* --- ОСНОВНАЯ СЕТКА --- */
        .app-header { 
            width: 100%; text-align: center; border-bottom: 1px solid var(--border-color); 
            padding: 20px 0; letter-spacing: 4px; font-weight: bold; text-transform: uppercase; 
            background: #000;
        }
        
        .balance-display { 
            font-size: 2.2em; color: var(--text-accent); font-weight: bold; margin: 15px 0; 
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }
        
        .back-btn { 
            position: absolute; top: 20px; left: 15px; background: none; 
            border: none; color: #888; font-family: var(--main-font); cursor: pointer; 
            text-transform: uppercase; font-size: 0.9em; transition: color 0.2s;
        }
        .back-btn:active { color: var(--text-accent); }
        
        .view-container { 
            width: 100%; height: calc(100% - 70px); display: flex; flex-direction: column; 
            align-items: center; justify-content: flex-start; overflow-y: auto; 
            padding: 30px 0; transition: opacity 0.3s;
        }
        .hidden { display: none !important; opacity: 0; }
        
        /* --- ГЛАВНОЕ МЕНЮ --- */
        #mainMenuView { width: 90%; max-width: 1000px; }
        .welcome-block { text-align: center; margin-bottom: 40px; }
        .welcome-label { color: #666; font-size: 0.9em; letter-spacing: 1px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; width: 100%; }
        
        .game-card { 
            background-color: var(--card-bg); border: 1px solid var(--border-color); 
            padding: 30px 20px; text-align: center; cursor: pointer; display: flex; 
            flex-direction: column; align-items: center; transition: all 0.2s;
        }
        .game-card:active { transform: scale(0.97); border-color: #555; }
        .game-card.disabled { opacity: 0.3; cursor: default; }
        .game-card.disabled:active { transform: none; }
        
        .game-icon { font-size: 2.5em; margin-bottom: 15px; }
        .game-title { font-size: 1.2em; font-weight: bold; color: var(--text-accent); margin-bottom: 8px; letter-spacing: 2px;}
        .game-desc { font-size: 0.85em; color: #666; }

        /* --- ЭКРАН DICE --- */
        #diceGameView { width: 90%; max-width: 400px; position: relative; }
        
        .user-card { 
            background-color: transparent; width: 100%; text-align: center; 
        }
        
        .input-group { margin-bottom: 25px; text-align: left; }
        .input-group label { display: flex; justify-content: space-between; font-size: 0.85em; color: #888; margin-bottom: 10px; letter-spacing: 1px; }
        
        .bet-input { 
            width: 100%; background-color: transparent; border: none; 
            border-bottom: 2px solid var(--border-color); color: var(--text-accent); 
            padding: 10px 0; font-size: 1.8em; font-family: var(--main-font); 
            text-align: center; outline: none; transition: border-color 0.2s;
        }
        .bet-input:focus { border-color: var(--text-main); }
        
        .slider { -webkit-appearance: none; width: 100%; height: 2px; background: var(--border-color); outline: none; margin: 10px 0 20px 0; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; background: var(--text-accent); cursor: pointer; border-radius: 0; box-shadow: 0 0 10px rgba(255,255,255,0.2); }
        
        .stats-row { 
            display: flex; justify-content: space-between; font-size: 0.85em; color: #666; 
            margin-bottom: 30px; padding-top: 15px; border-top: 1px solid var(--border-color); text-align: left;
        }
        .stats-row > div { width: 48%; }
        .highlight { color: var(--text-accent); font-weight: bold; font-size: 1.3em; display: block; margin-top: 5px; }
        
        /* Инвертированная кнопка */
        .btn-play { 
            background-color: var(--text-accent); color: #000; border: none; 
            padding: 18px; font-size: 1.2em; font-weight: bold; font-family: var(--main-font); 
            cursor: pointer; width: 100%; text-transform: uppercase; letter-spacing: 2px;
            transition: all 0.1s;
        }
        .btn-play:active { background-color: #aaa; transform: translateY(2px); }
        .btn-play:disabled { background-color: #333; color: #666; cursor: default; transform: none; }
        
        /* Блок результата с ЖЕСТКОЙ высотой (защита от скачков макета) */
        #resultDisplayWrapper {
            height: 80px; /* Фиксируем высоту */
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #resultDisplay { 
            width: 100%; height: 100%; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s;
        }
        #resultDisplay.active { opacity: 1; }
        
        .res-win { color: var(--green-bet); text-shadow: 0 0 15px rgba(76,175,80,0.4); }
        .res-lose { color: var(--red-lose); animation: loseShake 0.3s; }
        
        .result-status { font-size: 1.4em; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }
        .result-roll { font-size: 0.9em; color: #666; }
        
        @keyframes loseShake { 0%, 100% { transform: translateX(0); } 25%, 75% { transform: translateX(-8px); } 50% { transform: translateX(8px); } }
        
        .dice-rolling { opacity: 0.5; filter: blur(1px); }
    </style>
</head>
<body>
    <div id="screenFlash" class="screen-flash"></div>

    <div class="app-header">CHIMERA</div>
    
    <div id="mainMenuView" class="view-container">
        <div class="welcome-block">
            <div class="welcome-label">ID: <span id="menuUserName" style="color:#aaa">...</span></div>
            <div class="balance-display" id="menuBalance">0.00 USDT</div>
        </div>
        <div class="game-grid">
            <div class="game-card" onclick="openGame('dice')">
                <div class="game-icon">🎲</div>
                <div class="game-title">DICE</div>
                <div class="game-desc">Протокол вероятности</div>
            </div>
            <div class="game-card disabled"><div class="game-icon">💣</div><div class="game-title">MINES</div></div>
            <div class="game-card disabled"><div class="game-icon">🎰</div><div class="game-title">SLOTS</div></div>
        </div>
    </div>
    
    <div id="diceGameView" class="view-container hidden">
        <button class="back-btn" onclick="closeGame()">[ Меню ]</button>
        <div class="user-card" id="gameCardCore">
            <div style="color: #666; font-size: 0.8em; letter-spacing: 2px;">ТЕКУЩИЙ БАЛАНС</div>
            <div class="balance-display" id="gameBalance">0.00 USDT</div>
            
            <div class="input-group">
                <label><span>СТАВКА</span> <span>USDT</span></label>
                <input type="number" id="betAmount" class="bet-input" value="10.00" step="1">
            </div>
            
            <div class="input-group">
                <label><span>ШАНС</span> <span style="color:#fff"><span id="chanceDisplay">50</span>%</span></label>
                <input type="range" min="1" max="95" value="50" class="slider" id="chanceSlider">
            </div>
            
            <div class="stats-row">
                <div>МНОЖИТЕЛЬ<span id="multiplierDisplay" class="highlight">1.90x</span></div>
                <div>ВЫПЛАТА<span id="payoutDisplay" class="highlight">19.00</span></div>
            </div>
            
            <button class="btn-play" onclick="rollDice()" id="playBtn">ROLL</button>
            
            <div id="resultDisplayWrapper">
                <div id="resultDisplay"></div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.ready();
        
        // Отключаем вертикальный скролл браузера (резиновый эффект)
        document.body.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

        const rawInitData = tg.initData;
        let currentBalance = 0.0; // Храним реальный баланс для анимации

        // Функция плавной накрутки цифр
        function animateBalance(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                // Эффект плавного замедления в конце (easeOutExpo)
                const easeOut = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
                const current = start + (end - start) * easeOut;
                
                obj.innerText = current.toFixed(2) + " USDT";
                
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerText = end.toFixed(2) + " USDT";
                }
            };
            window.requestAnimationFrame(step);
        }

        function fetchBalance() {
            fetch('/api/get_balance', {
                method: 'POST',
                headers: { 'X-Telegram-Init-Data': rawInitData, 'ngrok-skip-browser-warning': '69420' }
            }).then(r => r.json()).then(d => {
                if(d.balance !== undefined) {
                    currentBalance = d.balance;
                    document.getElementById('menuBalance').innerText = currentBalance.toFixed(2) + " USDT";
                    document.getElementById('gameBalance').innerText = currentBalance.toFixed(2) + " USDT";
                }
            });
        }

        if (tg.initDataUnsafe?.user) {
            document.getElementById('menuUserName').innerText = tg.initDataUnsafe.user.id;
            fetchBalance();
        }

        function openGame(g) { 
            document.getElementById('mainMenuView').classList.add('hidden'); 
            document.getElementById('diceGameView').classList.remove('hidden'); 
            updateStats(); 
        }
        
        function closeGame() { 
            document.getElementById('diceGameView').classList.add('hidden'); 
            document.getElementById('mainMenuView').classList.remove('hidden'); 
            document.getElementById('resultDisplay').classList.remove('active'); 
            document.getElementById('menuBalance').innerText = currentBalance.toFixed(2) + " USDT";
        }
        
        function updateStats() {
            const chance = parseFloat(document.getElementById('chanceSlider').value);
            const bet = parseFloat(document.getElementById('betAmount').value) || 0;
            document.getElementById('chanceDisplay').innerText = chance;
            const multiplier = 95 / chance;
            document.getElementById('multiplierDisplay').innerText = multiplier.toFixed(2) + "x";
            document.getElementById('payoutDisplay').innerText = (bet * multiplier).toFixed(2);
        }
        
        document.getElementById('chanceSlider').addEventListener('input', updateStats);
        document.getElementById('betAmount').addEventListener('input', updateStats);

        function triggerScreenFlash(type) {
            const flash = document.getElementById('screenFlash');
            flash.className = `screen-flash ${type}`;
            void flash.offsetWidth; // Сброс анимации
            flash.classList.add('active');
            setTimeout(() => flash.classList.remove('active', type), 1500);
        }

        function rollDice() {
            const bet = parseFloat(document.getElementById('betAmount').value);
            const chance = parseFloat(document.getElementById('chanceSlider').value);
            const btn = document.getElementById('playBtn'); 
            const res = document.getElementById('resultDisplay');
            const gameCore = document.getElementById('gameCardCore');
            const gameBalElement = document.getElementById('gameBalance');
            
            btn.disabled = true; 
            btn.innerText = "PROCESSING..."; 
            res.classList.remove('active'); // Прячем старый результат
            
            tg.HapticFeedback.impactOccurred('medium');

            fetch('/api/dice_roll', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': rawInitData, 'ngrok-skip-browser-warning': '69420' },
                body: JSON.stringify({ bet: bet, chance: chance })
            }).then(r => r.json()).then(d => {
                btn.disabled = false; 
                btn.innerText = "ROLL";
                
                if(d.error) { 
                    res.innerHTML = `<div class="result-status res-lose">${d.error}</div>`; 
                    res.classList.add('active');
                    return; 
                }
                
                if(d.status === 'win') {
                    tg.HapticFeedback.notificationOccurred('success');
                    triggerScreenFlash('win');
                    res.innerHTML = `<div class="result-status res-win">+${d.profit.toFixed(2)}</div><div class="result-roll">ROLL: ${d.roll}</div>`;
                    res.classList.add('active');
                    
                    // Плавная накрутка баланса по копейкам (1.5 секунды)
                    animateBalance(gameBalElement, currentBalance, d.new_balance, 1500);
                    currentBalance = d.new_balance;
                    
                } else {
                    tg.HapticFeedback.notificationOccurred('error');
                    triggerScreenFlash('lose');
                    res.innerHTML = `<div class="result-status res-lose">LOSE</div><div class="result-roll">ROLL: ${d.roll}</div>`;
                    res.classList.add('active');
                    
                    // Моментальное списание при поражении
                    currentBalance = d.new_balance;
                    gameBalElement.innerText = currentBalance.toFixed(2) + " USDT";
                }
            });
        }
    </script>
</body>
</html>
