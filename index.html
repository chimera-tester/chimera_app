<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHIMERA | TERMINAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Бруталистский дизайн Рика Оуэнса: темно, строго, без градиентов */
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace; /* Терминальный шрифт */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            width: 100%;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .user-card {
            background-color: #1a1a1a;
            border: 1px solid #333;
            padding: 20px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .user-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
        }

        .balance {
            font-size: 2em;
            color: #4CAF50; /* Строгий зеленый цвет денег */
            margin: 15px 0;
            font-weight: bold;
        }

        .btn-play {
            background-color: #e0e0e0;
            color: #0d0d0d;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: all 0.2s;
        }

        .btn-play:active {
            background-color: #999;
            transform: scale(0.98);
        }

        /* Заглушка, если юзер открыл не в ТГ */
        #warning {
            color: #ff4444;
            display: none;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>CHIMERA SYSTEM</h1>
    </div>

    <div class="user-card" id="userCard">
        <div class="user-name" id="userName">INITIATING...</div>
        <div>ТЕКУЩИЙ БАЛАНС:</div>
        <div class="balance" id="userBalance">50.00 USDT</div>
        <button class="btn-play" onclick="playGame()">INITIATE DICE</button>
    </div>

    <div id="warning">ОШИБКА: ОТКРОЙТЕ ЧЕРЕЗ TELEGRAM</div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        
        // Расширяем на весь экран
        tg.expand();
        
        // Сообщаем Телеграму, что приложение готово
        tg.ready();

        // Проверяем, открыто ли в Телеграме, и вытягиваем имя
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('userName').innerText = "ID: " + user.id + " | " + (user.username || user.first_name);
            // Сообщаем бэкенду, что мы открылись (позже прикрутим проверку баланса)
        } else {
            // Если открыли просто в браузере
            document.getElementById('userCard').style.display = 'none';
            document.getElementById('warning').style.display = 'block';
        }

        // Функция заглушка для кнопки "Играть"
        function playGame() {
            // Включаем тактильную отдачу (вибрация при нажатии)
            tg.HapticFeedback.impactOccurred('medium');
            alert("СИСТЕМА УПРАВЛЕНИЯ DICE В РАЗРАБОТКЕ");
            // Здесь позже будет логика отправки ставки на твой сервер
        }
    </script>
</body>
</html>
